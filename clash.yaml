mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
profile:
  store-selected: true
  store-fake-ip: true
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
  - any:53
  - tcp://any:53
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - '*.arpa'
  - localhost.ptlogin2.qq.com
  - '*.msftncsi.com'
  - www.msftconnecttest.com
  - dns.msftncsi.com
  - time.*.com
  - ntp.*.com
  - stun.*.*
  default-nameserver:
  - https://1.12.12.12/dns-query
  - https://1.1.1.1/dns-query
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  proxy-server-nameserver:
  - https://1.12.12.12/dns-query
  - https://1.1.1.1/dns-query
  nameserver-policy:
    geosite:cn,private:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    geosite:geolocation-!cn:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback:
  - https://1.1.1.1/dns-query
  - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
    - 240.0.0.0/4
    - 0.0.0.0/32
  direct-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  direct-nameserver-follow-policy: true
  respect-rules: true
geodata-mode: true
geox-url:
  geoip: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat
  geosite: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  mmdb: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb
proxies:
- name: 🌀 DMIT-HY2
  type: hysteria2
  server: <redacted>
  port: 443
  password: <redacted>
  sni: <service-domain>
  skip-cert-verify: false
- name: 🛡️ DMIT-Reality
  type: vless
  server: <redacted>
  port: 443
  uuid: <redacted>
  network: tcp
  udp: true
  tls: true
  flow: xtls-rprx-vision
  servername: www.microsoft.com
  client-fingerprint: chrome
  reality-opts:
    public-key: <redacted>
    short-id: <redacted>
- name: 🧪 DMIT-XHTTP
  type: vless
  server: <redacted>
  port: 443
  uuid: <redacted>
  udp: true
  tls: true
  network: xhttp
  servername: <service-domain>
  client-fingerprint: chrome
  encryption: ''
  xhttp-opts:
    path: <redacted>
    host: <service-domain>
    mode: auto
- name: 🌀 DMIT-HY2-v6
  type: hysteria2
  server: <redacted>
  port: 443
  password: <redacted>
  sni: <service-domain>
  skip-cert-verify: false
- name: 🛡️ DMIT-Reality-v6
  type: vless
  server: <redacted>
  port: 443
  uuid: <redacted>
  network: tcp
  udp: true
  tls: true
  flow: xtls-rprx-vision
  servername: www.microsoft.com
  client-fingerprint: chrome
  reality-opts:
    public-key: <redacted>
    short-id: <redacted>
- name: 🧪 DMIT-XHTTP-v6
  type: vless
  server: <redacted>
  port: 443
  uuid: <redacted>
  udp: true
  tls: true
  network: xhttp
  servername: <service-domain>
  client-fingerprint: chrome
  encryption: ''
  xhttp-opts:
    path: <redacted>
    host: <service-domain>
    mode: auto
proxy-groups:
- name: 🚀 Default
  type: select
  proxies:
  - DIRECT
  - ♻️ Auto
  - 🧩 Select
  - 🌀 DMIT-HY2
  - 🛡️ DMIT-Reality
  - 🧪 DMIT-XHTTP
- name: ♻️ Auto
  type: url-test
  proxies:
  - 🌀 DMIT-HY2
  - 🛡️ DMIT-Reality
  - 🧪 DMIT-XHTTP
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 80
  lazy: true
- name: 🧩 Select
  type: select
  proxies:
  - DIRECT
  - 🌀 DMIT-HY2
  - 🛡️ DMIT-Reality
  - 🧪 DMIT-XHTTP
  - 🌀 DMIT-HY2-v6
  - 🛡️ DMIT-Reality-v6
  - 🧪 DMIT-XHTTP-v6
- name: 💻 Develop
  type: select
  proxies:
  - 🚀 Default
  - ♻️ Auto
  - 🧩 Select
  - 🌀 DMIT-HY2
  - 🛡️ DMIT-Reality
  - 🧪 DMIT-XHTTP
- name: 🎬 Media/Social
  type: select
  proxies:
  - 🚀 Default
  - ♻️ Auto
  - 🧩 Select
  - 🌀 DMIT-HY2
  - 🛡️ DMIT-Reality
  - 🧪 DMIT-XHTTP
- name: Ⓜ️ Microsoft
  type: select
  proxies:
  - DIRECT
  - 🚀 Default
  - ♻️ Auto
  - 🧩 Select
  - 🌀 DMIT-HY2
  - 🛡️ DMIT-Reality
  - 🧪 DMIT-XHTTP
- name: 🇨🇳 Direct
  type: select
  proxies:
  - DIRECT
